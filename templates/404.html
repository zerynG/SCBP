{% extends 'base.html' %}
{% load static %}

{% block title %}Страница не найдена — IQNIX TECH{% endblock %}

{% block extra_css %}
<style>
    .err-page {
        max-width: 720px;
        margin: 4rem auto;
        padding: 3rem 2rem;
        text-align: center;
    }
    .err-code {
        font-size: 6rem;
        font-weight: 800;
        color: var(--accent);
        letter-spacing: -.04em;
        margin-bottom: .25rem;
    }
    .err-title { font-size: 1.5rem; font-weight: 700; color: var(--text-strong); margin-bottom: .5rem; }
    .err-text { color: var(--text-soft); margin-bottom: 1.5rem; }
    .err-actions { display: flex; gap: .5rem; justify-content: center; }
</style>
{% endblock %}

{% block content %}
<section class="err-page">
    <div class="err-code">404</div>
    <div class="err-title">Страница не найдена</div>
    <p class="err-text">Запрашиваемая страница не существует или была перемещена.</p>
    <div class="err-actions">
        <a href="/" class="app-btn app-btn-primary"><i class="fas fa-home"></i> На главную</a>
        <a href="javascript:history.back()" class="app-btn"><i class="fas fa-arrow-left"></i> Назад</a>
    </div>
</section>
{% endblock %}
