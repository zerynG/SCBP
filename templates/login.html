{% load static %}
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему | IQNIX TECH</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}">
    
    <link rel="stylesheet" href="{% static 'login/login.css' %}?version={% now "Y-m-d H:i" %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1><i class="fas fa-sign-in-alt"></i> Войти в личный кабинет</h1>
                <p>Введите ваши учетные данные для доступа к системе</p>
            </div>
            
            {% if messages %}
            <div class="messages">
                {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    <i class="fas fa-exclamation-triangle"></i>
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}
            
            <form method="post" class="login-form">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_email">
                        <i class="fas fa-envelope"></i> Email
                    </label>
                    <div class="input-container">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="id_email" name="email" placeholder="Введите ваш email" required autofocus value="{{ email_value|default:'' }}">
                    </div>
                </div>
                <div class="form-group">
                    <label for="id_password">
                        <i class="fas fa-lock"></i> Пароль
                    </label>
                    <div class="input-container">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="id_password" name="password" placeholder="Введите ваш пароль" required>
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <i class="fas fa-eye" id="password-icon"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="login-button">
                    <i class="fas fa-sign-in-alt"></i> Войти
                </button>
            </form>
            
            <div class="login-footer">
                <div class="footer-links">
                    <a href="#" class="footer-link">
                        <i class="fas fa-question-circle"></i> Нужна помощь?
                    </a>
                    <a href="#" class="footer-link">
                        <i class="fas fa-shield-alt"></i> Безопасность
                    </a>
                </div>
            </div>
        </div>
    </div>

    <style>
    :root {
        --primary-color: #8B5CF6;
        --primary-hover: #7C3AED;
        --card-background: #2a2a2a;
        --text-primary: #ffffff;
        --text-secondary: #b0b0b0;
        --input-background: #3a3a3a;
        --input-border: #4a4a4a;
        --error-color: #ff6b6b;
        --background-dark: #1a1a1a;
    }


    .logo-container {
        margin-bottom: 24px;
    }

    .login-header h1 {
        font-size: 1.8rem;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
    }

    .login-header h1 i {
        color: var(--primary-color);
    }

    .login-header p {
        color: var(--text-secondary);
        font-size: 14px;
        margin: 0;
    }

    .messages {
        margin-bottom: 24px;
    }

    .alert {
        padding: 12px 16px;
        border-radius: 8px;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
    }

    .alert-error {
        background: rgba(255, 107, 107, 0.1);
        color: var(--error-color);
        border: 1px solid rgba(255, 107, 107, 0.3);
    }

    .alert-success {
        background: rgba(76, 175, 80, 0.1);
        color: #4caf50;
        border: 1px solid rgba(76, 175, 80, 0.3);
    }

    .login-form {
        margin-bottom: 24px;
    }

    .form-group {
        margin-bottom: 20px;
        text-align: left;
    }

    .form-group label {
        display: block;
        font-size: 14px;
        font-weight: 500;
        color: var(--text-primary);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .form-group label i {
        color: var(--primary-color);
        width: 16px;
        text-align: center;
    }

    .input-container {
        position: relative;
        display: flex;
        align-items: center;
    }

    .input-icon {
        position: absolute;
        left: 12px;
        color: var(--text-secondary);
        font-size: 16px;
        z-index: 1;
    }

    .form-group input {
        width: 100%;
        padding: 12px 45px;
        border: 2px solid var(--input-border);
        border-radius: 8px;
        font-size: 14px;
        transition: border-color 0.2s ease;
        background: var(--input-background);
        color: var(--text-primary);
    }

    .form-group input:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        background: var(--input-background);
    }

    .password-toggle {
        position: absolute;
        right: 12px;
        background: none;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 16px;
        z-index: 1;
    }

    .password-toggle:hover {
        color: var(--primary-color);
    }

    .login-button {
        width: 100%;
        background: var(--primary-color);
        color: white;
        border: none;
        padding: 14px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .login-button:hover {
        background: var(--primary-hover);
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
    }

    .login-button:active {
        transform: translateY(0);
    }

    .login-footer {
        margin-top: 24px;
        padding-top: 24px;
        border-top: 1px solid var(--input-border);
    }

    .footer-links {
        display: flex;
        justify-content: space-between;
        gap: 16px;
    }

    .footer-link {
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 4px;
        transition: color 0.2s ease;
    }

    .footer-link:hover {
        color: var(--primary-color);
    }

    @media (max-width: 480px) {
        .login-container {
            padding: 16px;
        }
        
        .login-card {
            padding: 24px;
        }
        
        .login-header h1 {
            font-size: 1.5rem;
        }
        
        .footer-links {
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
    }
    </style>

    <script>
    function togglePassword() {
        const passwordInput = document.getElementById('id_password');
        const passwordIcon = document.getElementById('password-icon');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            passwordIcon.classList.remove('fa-eye');
            passwordIcon.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            passwordIcon.classList.remove('fa-eye-slash');
            passwordIcon.classList.add('fa-eye');
        }
    }
    </script>
</body>

</html>
